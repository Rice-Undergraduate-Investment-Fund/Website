<!doctype html>
<html>
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /></head>
  <body>
    <!--
      Form definition for Netlify Forms (detected at deploy time).
      The real form lives in components/contact/contact-form.tsx and posts here.
      Field names must match that component.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="company" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="subject" type="text" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
